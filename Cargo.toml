[package]
name = "pi-auto-feeder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pi-auto-feeder"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
color-eyre = "0.6.5"
futures-util = "0.3.32"
http-body = "1.0.1"
http-body-util = "0.1.3"
rppal = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
topcoat = { version = "0.5.0", features = ["htmx", "sse"] }
